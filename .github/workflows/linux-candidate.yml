# Acceptance of one release candidate on Linux, kept apart from the release workflow (nothing is published here: no
# tag, no release). From the candidate commit:
#   1. the type check;
#   2. the whole test suite through both entry points (npm test and node --test), compared; the Linux install tests
#      and the install-fault tests must have run, not been skipped;
#   3. the Linux x64 package and its SHA-256;
#   4. that same .tar.gz installed by its own install.sh into an isolated HOME, started on a virtual display (Xvfb)
#      through its own launcher (the installed command, a link to aivenue.sh) with an empty AIVENUE_HOME, and its
#      version, build and data folder read back from it (capabilities-check.mjs); twice: in a plain environment, and
#      with ELECTRON_RUN_AS_NODE=1 inherited by the launcher (as from a terminal VS Code or Claude Code opened), next
#      to a control showing that variable stops the app binary itself; then closed and uninstalled;
#   5. the fixed conversations and expected texts for the Ubuntu desktop check of the copy buttons (copy-fixtures.mjs:
#      no model is called).
# Uploads, as this run's artifacts only: the package with its SHA-256, the quick-check kit, and the logs.
# Runs on a push to a candidate/** branch (its head is the candidate), or by hand for a given commit.
name: Linux candidate

on:
  push:
    branches:
      - 'candidate/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'The candidate commit (full SHA)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-candidate-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE: ${{ inputs.ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: The candidate commit and its version
        id: c
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          want="$(git rev-parse --verify "$CANDIDATE^{commit}")"
          if [ "$sha" != "$want" ]; then echo "::error::Checked out $sha, not the candidate $CANDIDATE"; exit 1; fi
          version="$(node -p "require('./packages/desktop/package.json').version")"
          mkdir -p out/logs
          echo "Candidate $sha, version $version, $(date -u +%Y-%m-%dT%H:%M:%SZ), $(lsb_release -ds) $(uname -m)" | tee out/logs/candidate.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: A virtual display and Electron's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxtst6

      - run: npm ci

      - name: Type check
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee out/logs/typecheck.log

      - name: Whole test suite, both entry points, compared
        shell: bash
        run: |
          set -u
          xvfb-run -a env AIVENUE_TEST_VERBOSE=1 npm test > out/logs/test-npm.log 2>&1; npm_exit=$?
          xvfb-run -a node --test --test-reporter=spec scripts/test-*.mjs > out/logs/test-direct.log 2>&1; direct_exit=$?
          node scripts/accept/compare-runs.mjs out/logs/test-direct.log out/logs/test-npm.log > out/logs/test-compare.log 2>&1; compare_exit=$?
          echo "npm test exit $npm_exit; node --test exit $direct_exit; compare exit $compare_exit" | tee out/logs/test-exits.txt
          tail -n 4 out/logs/test-compare.log
          grep -E '^ℹ (tests|pass|fail|skipped|todo) ' out/logs/test-direct.log | tail -n 5
          [ "$npm_exit" = 0 ] && [ "$direct_exit" = 0 ] && [ "$compare_exit" = 0 ]

      - name: The Linux install and install-fault tests ran (not skipped)
        shell: bash
        run: |
          set -euo pipefail
          for f in test-linux-install test-linux-install-faults; do
            line="$(grep -E "scripts/$f\.mjs +[0-9]+ tests" out/logs/test-npm.log | tail -n 1)"
            echo "$line" | tee -a out/logs/linux-install-tests.txt
            echo "$line" | grep -Eq ' 0 fail +0 skipped ' || { echo "::error::$f did not run in full: $line"; exit 1; }
          done

      - name: Package Linux x64, and its SHA-256
        shell: bash
        env:
          VERSION: ${{ steps.c.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          npm run package:linux > out/logs/package.log 2>&1
          name="Aivenue-$VERSION-linux-x64.tar.gz"
          cp "release/$name" out/
          (cd out && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          ls -l "out/$name"

      - name: Install in an isolated HOME; start it through its own launcher on a virtual display, plainly and with ELECTRON_RUN_AS_NODE=1 inherited; read back version and build
        shell: bash
        env:
          VERSION: ${{ steps.c.outputs.version }}
          SHA: ${{ steps.c.outputs.sha }}
        run: |
          set -uo pipefail
          S="$RUNNER_TEMP/smoke"
          L="$PWD/out/logs"
          mkdir -p "$S/home" "$S/unpack"
          tar -xzf "out/Aivenue-$VERSION-linux-x64.tar.gz" -C "$S/unpack"
          HOME="$S/home" sh "$S/unpack/Aivenue-$VERSION-linux-x64/install.sh" > "$L/install.log" 2>&1 || { cat "$L/install.log"; exit 1; }
          APP="$S/home/.local/share/aivenue/aivenue"
          CMD="$S/home/.local/bin/aivenue"
          test -L "$CMD" && test -x "$APP" || { echo "::error::install.sh did not put the command and the app in place"; exit 1; }
          echo "The installed command: $CMD -> $(readlink "$CMD")" | tee "$L/smoke.txt"
          ok=1
          # Control: the same Electron binary started directly with the variable, as aivenue.sh without the fix did.
          # It must run as plain Node and refuse the Chromium option; otherwise the second start below proves nothing.
          ELECTRON_RUN_AS_NODE=1 timeout 60 "$APP" --remote-debugging-port=9234 > "$L/control-run-as-node.log" 2>&1; control=$?
          echo "control (app binary started directly with ELECTRON_RUN_AS_NODE=1): exit $control; $(head -n 1 "$L/control-run-as-node.log")" | tee -a "$L/smoke.txt"
          { [ "$control" != 0 ] && grep -q 'bad option: --remote-debugging-port=9234' "$L/control-run-as-node.log"; } || { echo "::error::the control did not show the variable breaking the app"; ok=0; }
          # The main process only (no --type=): it ends its own helpers.
          main_pid() { pgrep -af "^$APP" | grep -v -- ' --type=' | cut -d' ' -f1 || true; }
          # Each start goes through the installed command (the link to aivenue.sh) with the given environment changes.
          # A small sh writes down the environment it was given and then becomes the launcher (exec keeps the
          # environment), so the file shows what the launcher itself started with.
          launch() { # <name> <port> <env arguments…>
            local name="$1" port="$2"; shift 2
            mkdir -p "$S/data-$name"
            (env "$@" HOME="$S/home" AIVENUE_HOME="$S/data-$name" xvfb-run -a -s '-screen 0 1600x1000x24' \
              sh -c 'echo "ELECTRON_RUN_AS_NODE=${ELECTRON_RUN_AS_NODE-unset} ELECTRON_NO_ATTACH_CONSOLE=${ELECTRON_NO_ATTACH_CONSOLE-unset}" > "$1"; shift; exec "$@"' \
              launch-env "$L/launch-env-$name.txt" "$CMD" --remote-debugging-port="$port" > "$L/app-$name.log" 2>&1 &)
            WANT_DATA_DIR="$S/data-$name" WANT_VERSION="$VERSION" node scripts/accept/capabilities-check.mjs "$port" "$SHA" out/smoke "linux-$name" 2>&1 | tee "$L/capabilities-$name.log"
            local check=${PIPESTATUS[0]}
            local main first; main="$(main_pid)"; first="$(echo "$main" | head -n 1)"
            # What the app process itself was started with (the launcher exec-ed it): the variable must be gone.
            local inherited="(no app process)"
            [ -n "$first" ] && [ -r "/proc/$first/environ" ] && inherited="$(tr '\0' '\n' < "/proc/$first/environ" | grep -c '^ELECTRON_RUN_AS_NODE=' || true)"
            [ -n "$main" ] && kill -TERM $main 2>/dev/null
            for _ in $(seq 1 20); do pgrep -f "^$APP" > /dev/null || break; sleep 1; done
            local left; left="$(pgrep -fc "^$APP" || true)"
            pkill -KILL -f "^$APP" 2>/dev/null || true
            echo "$name: launcher started with $(cat "$L/launch-env-$name.txt" 2>/dev/null || echo '(nothing written)'); capabilities-check exit $check; ELECTRON_RUN_AS_NODE in the app process's environment: $inherited; processes left after closing: ${left:-0}" | tee -a "$L/smoke.txt"
            if grep -q FATAL "$L/app-$name.log"; then echo "::error::app-$name.log has a FATAL line"; ok=0; fi
            [ "$check" = 0 ] && [ "$inherited" = 0 ] && [ "${left:-0}" = 0 ] || { echo "::error::start $name failed"; ok=0; }
          }
          # 1. A plain environment.
          launch plain 9232 -u ELECTRON_RUN_AS_NODE -u ELECTRON_NO_ATTACH_CONSOLE
          grep -qx 'ELECTRON_RUN_AS_NODE=unset ELECTRON_NO_ATTACH_CONSOLE=unset' "$L/launch-env-plain.txt" || { echo "::error::the plain start had the variables set"; ok=0; }
          # 2. Started from a process that runs Electron as Node (VS Code extensions, Claude Code): the variables are
          #    inherited, and must reach the launcher.
          launch run-as-node 9233 ELECTRON_RUN_AS_NODE=1 ELECTRON_NO_ATTACH_CONSOLE=1
          grep -qx 'ELECTRON_RUN_AS_NODE=1 ELECTRON_NO_ATTACH_CONSOLE=1' "$L/launch-env-run-as-node.txt" || { echo "::error::the variables did not reach the launcher"; ok=0; }
          HOME="$S/home" sh "$S/home/.local/share/aivenue/uninstall.sh" > "$L/uninstall.log" 2>&1; un=$?
          echo "uninstall exit $un; command left: $(test -e "$CMD" && echo yes || echo no)" | tee -a "$L/smoke.txt"
          [ "$ok" = 1 ] && [ "$un" = 0 ] && [ ! -e "$CMD" ]

      - name: Quick-check kit for the Ubuntu desktop (fixed conversations and the texts a copy must give)
        shell: bash
        env:
          VERSION: ${{ steps.c.outputs.version }}
        run: |
          set -euo pipefail
          K="out/kit/aivenue-$VERSION-quick-check"
          node scripts/accept/copy-fixtures.mjs "$K/app-home" "$K/app-proj" app "$K/expected" | tee -a out/logs/kit.log
          node scripts/accept/copy-fixtures.mjs "$K/vscode-home" "$K/vscode-proj" vscode | tee -a out/logs/kit.log
          tar -czf "out/aivenue-$VERSION-quick-check.tar.gz" -C out/kit "aivenue-$VERSION-quick-check"
          (cd out && sha256sum "aivenue-$VERSION-quick-check.tar.gz" > "aivenue-$VERSION-quick-check.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-${{ steps.c.outputs.short }}
          path: |
            out/Aivenue-${{ steps.c.outputs.version }}-linux-x64.tar.gz
            out/Aivenue-${{ steps.c.outputs.version }}-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: quick-check-${{ steps.c.outputs.short }}
          path: |
            out/aivenue-${{ steps.c.outputs.version }}-quick-check.tar.gz
            out/aivenue-${{ steps.c.outputs.version }}-quick-check.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ steps.c.outputs.short || github.run_id }}
          path: |
            out/logs
            out/smoke
          if-no-files-found: warn
